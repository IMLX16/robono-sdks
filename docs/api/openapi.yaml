            display_name: { type: string }
    Reaction:
      type: object
      required: [emoji, removed, reacted_at]
      properties:
        emoji:
          type: [string, "null"]
          description: Curated reaction emoji, or null when the reaction was removed.
        removed: { type: boolean }
        reacted_at: { type: string, format: date-time }
    ReactionSender:
      type: object
      required: [type, robono_user_id, display_name, phone_masked]
      properties:
        type: { const: robono_user }
        robono_user_id: { type: string, format: uuid }
        display_name: { type: string }
        phone_masked: { type: [string, "null"] }
    GuardianMessageStatus:
      type: string
      enum: [stored, accepted, delivered, read, failed, replaced]
    TransformCompletedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEventBase"
        - type: object
          required:
            - event
            - transform_kind
            - status
            - artifacts
            - billing
          properties:
            event: { const: transform.completed }
            transform_kind: { type: string, enum: [message, speech] }
            status: { const: completed }
            connection_id: { type: string, format: uuid }
            message_id: { type: string, format: uuid }
            external_request_id: { type: [string, "null"] }
            artifacts: { $ref: "#/components/schemas/TransformArtifacts" }
            billing: { $ref: "#/components/schemas/TransformBilling" }
    TransformFailedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEventBase"
        - type: object
          required: [event, transform_kind, status, error]
          properties:
            event: { const: transform.failed }
            transform_kind: { type: string, enum: [message, speech] }
            status: { const: failed }
            connection_id: { type: string, format: uuid }
            message_id: { type: string, format: uuid }
            external_request_id: { type: [string, "null"] }
            error:
              type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
    DiagnosticPushWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/WebhookEventBase"
        - type: object
          required:
            - event
            - push_diagnostic_id
            - diagnostic_token
            - external_user_id
          properties:
            event: { const: diagnostic.push_requested }
            push_diagnostic_id: { type: string, format: uuid }
            diagnostic_token: { type: string }
            external_user_id: { type: string }
    WebhookEvent:
      oneOf:
        - $ref: "#/components/schemas/ConnectionWebhookEvent"
        - $ref: "#/components/schemas/MessageCreatedWebhookEvent"
        - $ref: "#/components/schemas/MessageReceiptWebhookEvent"
        - $ref: "#/components/schemas/MessageReactionWebhookEvent"
        - $ref: "#/components/schemas/BridgeConnectionRequestedWebhookEvent"
        - $ref: "#/components/schemas/BridgeConnectionChangedWebhookEvent"
        - $ref: "#/components/schemas/BridgeDirectoryChangedWebhookEvent"
        - $ref: "#/components/schemas/BridgeMessageCreatedWebhookEvent"
        - $ref: "#/components/schemas/BridgeMessageStatusWebhookEvent"
        - $ref: "#/components/schemas/BridgeGuardianMessageCreatedWebhookEvent"
        - $ref: "#/components/schemas/BridgeGuardianMessageStatusWebhookEvent"
        - $ref: "#/components/schemas/TransformCompletedWebhookEvent"
        - $ref: "#/components/schemas/TransformFailedWebhookEvent"
        - $ref: "#/components/schemas/DiagnosticPushWebhookEvent"
    GuardianMessage:
      type: object
      required: [guardian_message_id, bridge_connection_id, direction, sender_external_guardian_id, external_message_id, message_kind, text_body, status, created_at]
      properties:
        guardian_message_id: { type: string, format: uuid }
        bridge_connection_id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        sender_external_guardian_id: { type: string }
        external_message_id: { type: string }
        message_kind: { const: text }
        text_body: { type: string }
        status: { type: string, enum: [stored, accepted, delivered, read, failed, replaced] }
        accepted_at: { type: [string, "null"], format: date-time }
        accepted_via: { type: [string, "null"], enum: [push, polling, null] }
        delivered_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        failure_code: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
