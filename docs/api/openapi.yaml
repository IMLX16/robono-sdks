        "2XX":
          description: |
            Event durably accepted. Return any 2xx response, including 200 or
            202, within 10 seconds. Duplicate event IDs must also return 2xx.
            A timeout, network failure, redirect, or non-2xx response triggers
            up to five retry attempts with increasing delay capped at 15 minutes.
paths:
  /networks:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listNetworks
      summary: List networks available for new connections
      tags: [Networks]
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          description: Available networks and the identifier required by each network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDirectoryResponse"
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-connections:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: requestNetworkConnection
      summary: Request a connection to a user in another network
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestConnection"
      responses:
        "200":
          description: Connection request stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-connections/respond:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: respondToNetworkConnection
      summary: Accept, reject, or report no match for an incoming request
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondConnection"
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-connections/list:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listNetworkConnections
      summary: Recover or synchronize connections
      tags: [Connections]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                external_user_id: { type: string, maxLength: 160 }
                bridge_connection_id: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/ConnectionStatus" }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
                before: { type: string, format: date-time }
      responses:
        "200":
          description: Connections visible to this network
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, connections, has_more]
                properties:
                  ok: { const: true }
                  request_id: { type: string }
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
                  has_more: { type: boolean }
                  next_before: { type: [string, "null"], format: date-time }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-connections/disconnect:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: disconnectNetworkConnection
      summary: Disconnect a network relationship
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id, external_user_id]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                external_user_id: { type: string, maxLength: 160 }
                reason: { type: string, maxLength: 240 }
                disconnected_at: { type: string, format: date-time }
      responses:
        "200":
          description: Disconnected connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-connections/update:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: updateNetworkConnection
      summary: Update a participant display name, language/rules, or guardians
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id, external_user_id]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                external_user_id: { type: string, maxLength: 160 }
                display_name: { type: string, maxLength: 160 }
                external_profile: { $ref: "#/components/schemas/ExternalProfile" }
                capabilities: { $ref: "#/components/schemas/Capabilities" }
                guardians:
                  type: array
                  items: { $ref: "#/components/schemas/Guardian" }
      responses:
        "200":
          description: Updated connection and newly negotiated limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-messages:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: sendNetworkMessage
      summary: Send content across an accepted connection
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "200":
          description: Message stored or accepted by the destination network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-messages/list:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listNetworkMessages
      summary: Recover or synchronize messages and delivery states
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                external_user_id: { type: string, maxLength: 160 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
                before: { type: string, format: date-time }
                after:
                  type: string
                  format: date-time
                  description: Return only messages created after this synchronization cursor. Do not combine with before.
      responses:
        "200":
          description: Messages visible to this network
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, messages, has_more]
                properties:
                  ok: { const: true }
                  request_id: { type: string }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  has_more: { type: boolean }
                  next_before: { type: [string, "null"], format: date-time }
                  next_after: { type: [string, "null"], format: date-time }
                  sync_cursor: { type: [string, "null"], format: date-time }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /network-messages/events:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: markNetworkMessage
      summary: Report that a received message was delivered, read, or heard
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id, bridge_message_id, event]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                bridge_message_id: { type: string, format: uuid }
                event:
                  type: string
                  enum: [delivered, read, heard]
                occurred_at: { type: string, format: date-time }
      responses:
        "200":
          description: Current message state
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, bridge_message_id, status, occurred_at]
                properties:
                  ok: { const: true }
                  request_id: { type: string }
                  bridge_message_id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/MessageStatus" }
                  occurred_at: { type: string, format: date-time }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /guardian-messages:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: sendGuardianMessage
      summary: Send a guardian message through a guardian-enabled connection
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id, external_guardian_id, external_message_id, text_body]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                external_guardian_id: { type: string, maxLength: 160 }
                external_message_id: { type: string, maxLength: 160 }
                message_kind: { const: text }
                text_body: { type: string, minLength: 1 }
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Guardian message result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /guardian-messages/list:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listGuardianMessages
      summary: Recover or synchronize guardian messages and delivery states
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
                before: { type: string, format: date-time }
      responses:
        "200":
          description: Guardian messages visible to this network
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, messages, has_more]
                properties:
                  ok: { const: true }
                  request_id: { type: string }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/GuardianMessage" }
                  has_more: { type: boolean }
                  next_before: { type: [string, "null"], format: date-time }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /guardian-messages/events:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: markGuardianMessage
      summary: Report that a guardian message was delivered or read
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bridge_connection_id, guardian_message_id, event]
              properties:
                bridge_connection_id: { type: string, format: uuid }
                guardian_message_id: { type: string, format: uuid }
                event: { type: string, enum: [delivered, read] }
                occurred_at: { type: string, format: date-time }
      responses:
        "200":
          description: Current guardian message state
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /connections:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: connectToRobono
      summary: Connect to a Robono-owned endpoint using its directory identifier
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_phone_e164, external_user_id, external_display_name]
              properties:
                target_phone_e164: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
                external_user_id: { type: string, maxLength: 160 }
                connection_id: { type: string, format: uuid }
                external_display_name: { type: string, maxLength: 160 }
                external_profile: { $ref: "#/components/schemas/ExternalProfile" }
                target_contact_label: { type: string, maxLength: 160 }
                monitoring_disclosure: { type: string }
                external_approval: { type: object, additionalProperties: true }
                capabilities: { $ref: "#/components/schemas/Capabilities" }
      responses:
        "200":
          description: Robono connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobonoConnectionResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /connections/list:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listRobonoConnections
      summary: Recover or synchronize connections to Robono-owned endpoints
      tags: [Connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_user_id]
              properties:
                external_user_id: { type: string, maxLength: 160 }
                connection_id: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/RobonoConnectionStatus" }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
                before: { type: string, format: date-time }
      responses:
        "200":
          description: Connections visible to this network user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobonoConnectionListResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /connections/profile:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: updateRobonoConnection
      summary: Update the user profile or rules attached to a connection
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, external_user_id]
              properties:
                connection_id: { type: string, format: uuid }
                external_user_id: { type: string, maxLength: 160 }
                external_display_name: { type: string, maxLength: 160 }
                external_profile: { $ref: "#/components/schemas/ExternalProfile" }
                capabilities: { $ref: "#/components/schemas/Capabilities" }
      responses:
        "200":
          description: Updated connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobonoConnectionResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /connections/disconnect:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: disconnectRobonoConnection
      summary: Disconnect from a Robono-owned endpoint
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, external_user_id]
              properties:
                connection_id: { type: string, format: uuid }
                external_user_id: { type: string, maxLength: 160 }
                reason: { type: string, maxLength: 240 }
                disconnected_at: { type: string, format: date-time }
      responses:
        "200":
          description: Disconnected connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobonoConnectionResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /messages:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: sendMessageToRobono
      summary: Send content through a connection to a Robono-owned endpoint
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRobonoMessage" }
      responses:
        "200":
          description: Message result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendRobonoMessageResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /messages/list:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listRobonoMessages
      summary: Recover or synchronize messages from a Robono-owned endpoint
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, external_user_id]
              properties:
                connection_id: { type: string, format: uuid }
                external_user_id: { type: string, maxLength: 160 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
                before: { type: string, format: date-time }
                after:
                  type: string
                  format: date-time
                  description: Return only messages created after this synchronization cursor. Do not combine with before.
      responses:
        "200":
          description: Messages visible to this network user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobonoMessageListResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /message-events:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: markRobonoMessage
      summary: Report that a message from a Robono-owned endpoint was delivered, read, or heard
      tags: [Messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobonoMessageEventRequest"
      responses:
        "200":
          description: Message receipt stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobonoMessageEventResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /languages:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: listLanguages
      summary: List translation and speech languages
      tags: [Transforms]
      responses:
        "200":
          description: Supported languages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /message-transforms:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: transformMessage
      summary: Request transcription, translation, TTS, or translated voice
      tags: [Transforms]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTransformRequest" }
      responses:
        "200":
          description: Transform result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /speech-transforms:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: transformSpeech
      summary: Request a standalone speech transform
      tags: [Transforms]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpeechTransformRequest" }
      responses:
        "200":
          description: Transform result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformResponse" }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
  /push-diagnostics/events:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: reportPushDiagnosticEvent
      summary: Report one completed step in a controlled push-delivery test
      tags: [Diagnostics]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diagnostic_id, diagnostic_token, stage]
              properties:
                diagnostic_id: { type: string, format: uuid }
                diagnostic_token: { type: string }
                stage:
                  type: string
                  enum: [provider_accepted, device_received, content_fetched, rendered, polling_recovered, failed]
                failure_stage: { type: string, maxLength: 80 }
                failure_reason: { type: string, maxLength: 320 }
                platform: { type: string, maxLength: 40 }
                provider: { type: string, maxLength: 60 }
                app_version: { type: string, maxLength: 40 }
                detail: { type: string, maxLength: 240 }
      responses:
        "200":
          description: Diagnostic timeline updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, diagnostic]
                properties:
                  ok: { const: true }
                  request_id: { type: string }
                  diagnostic: { type: object, additionalProperties: true }
        "4XX":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimit"
        "5XX":
          $ref: "#/components/responses/ServiceError"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: Robono API key
  parameters:
    ApiVersion:
      name: Robono-Api-Version
      in: header
      required: false
      description: Contract version in YYYY-MM-DD form. The current version is 2026-07-25.
      schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A stable operation value that makes retries safe. Official SDKs create
        one for retries performed within a single method call. Persist and
        reuse your own value when retrying the operation in a later call,
        process, job, or device session.
      schema: { type: string, minLength: 8, maxLength: 200 }
  requestBodies:
    JsonBody:
      required: false
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    Error:
      description: Request error
      headers:
        Retry-After:
          description: Seconds or HTTP date after which a retryable request may be attempted.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimit:
      description: Request rate or configured safety limit exceeded
      headers:
        Retry-After:
          required: true
          description: Seconds or HTTP date after which the request may be retried.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceError:
      description: Temporary Robono service failure
      headers:
        Retry-After:
          description: Optional delay before retrying.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        request_id: { type: string }
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
    Identifier:
      type: object
      required: [label, description, example, format, input_type, min_length, max_length, normalization, case_sensitive]
      properties:
        label: { type: string }
        description: { type: string }
        example: { type: string }
        format: { type: string }
        input_type:
          type: string
          enum: [text, tel, email, number]
        pattern:
          type: string
          description: ECMAScript regular expression applied after normalization.
        min_length: { type: integer, minimum: 1, maximum: 240 }
        max_length: { type: integer, minimum: 1, maximum: 240 }
        normalization:
          type: string
          enum: [none, trim, lowercase, uppercase, e164]
        case_sensitive: { type: boolean }
    Network:
      type: object
      required: [type, id, slug, display_name, accepted_identifier, default_capabilities]
      properties:
        type:
          type: string
          enum: [connected_app, robono_phone]
        id: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        icon_url: { type: string, format: uri }
        accepts_inbound_bridge_requests: { type: boolean }
        accepted_identifier: { $ref: "#/components/schemas/Identifier" }
        default_capabilities: { $ref: "#/components/schemas/Capabilities" }
    NetworkDirectoryResponse:
      type: object
      required: [ok, request_id, directory]
      properties:
        ok: { const: true }
        request_id: { type: string }
        directory:
          type: array
          items: { $ref: "#/components/schemas/Network" }
    Guardian:
      type: object
      required: [external_guardian_id]
      properties:
        external_guardian_id: { type: string, maxLength: 160 }
        display_name: { type: [string, "null"], maxLength: 160 }
        relationship_to_child: { type: [string, "null"], maxLength: 80 }
        avatar_url: { type: [string, "null"], format: uri }
    ExternalProfile:
      type: object
      properties:
        display_name: { type: string, maxLength: 160 }
        avatar:
          type: object
          required: [source_url]
          properties:
            source_url: { type: string, format: uri }
            mime_type: { type: string }
            version: { type: string }
            updated_at: { type: string, format: date-time }
    Capabilities:
      type: object
      description: Negotiated permissions and limits for both directions of a connection.
      additionalProperties: true
      properties:
        protocol_version: { type: string }
        allowed_outbound_message_kinds:
          type: array
          items: { $ref: "#/components/schemas/MessageKind" }
        allowed_inbound_message_kinds:
          type: array
          items: { $ref: "#/components/schemas/MessageKind" }
        history: { $ref: "#/components/schemas/HistoryCapabilities" }
        text: { $ref: "#/components/schemas/TextCapabilities" }
        voice: { $ref: "#/components/schemas/MediaCapabilities" }
        photo: { $ref: "#/components/schemas/MediaCapabilities" }
        video: { $ref: "#/components/schemas/MediaCapabilities" }
        document: { $ref: "#/components/schemas/MediaCapabilities" }
        receive_voice_waveforms: { type: boolean }
        receive_delivery_events: { type: boolean }
        receive_message_heard_events: { type: boolean }
        emoji_reactions:
          oneOf:
            - { type: boolean }
            - type: object
              required: [allowed]
              properties:
                allowed: { type: boolean }
        from_source_to_target: { $ref: "#/components/schemas/DirectionCapabilities" }
        from_target_to_source: { $ref: "#/components/schemas/DirectionCapabilities" }
    HistoryCapabilities:
      type: object
      required: [max_items, message_expires_after_seconds]
      properties:
        max_items: { type: [integer, "null"], minimum: 0 }
        message_expires_after_seconds: { type: [integer, "null"], minimum: 1 }
    TextCapabilities:
      type: object
      properties:
        max_characters: { type: integer, minimum: 1 }
    MediaOutputPreference:
      type: object
      properties:
        preferred_mime_type: { type: string }
        preferred_codec: { type: string }
        transcoding: { type: string, enum: [off, preferred, required] }
    MediaCapabilities:
      type: object
      properties:
        max_duration_ms: { type: integer, minimum: 1 }
        max_file_bytes: { type: integer, minimum: 1 }
        allowed_input_mime_types:
          type: array
          items: { type: string }
        max_width_px: { type: integer, minimum: 1 }
        max_height_px: { type: integer, minimum: 1 }
        max_items_per_message: { type: integer, minimum: 1 }
        strip_metadata: { type: boolean }
        output: { $ref: "#/components/schemas/MediaOutputPreference" }
    DirectionCapabilities:
      type: object
      required: [allowed_message_kinds]
      properties:
        allowed_message_kinds:
          type: array
          items: { $ref: "#/components/schemas/MessageKind" }
        text: { $ref: "#/components/schemas/TextCapabilities" }
        voice: { $ref: "#/components/schemas/MediaCapabilities" }
        photo: { $ref: "#/components/schemas/MediaCapabilities" }
        video: { $ref: "#/components/schemas/MediaCapabilities" }
        document: { $ref: "#/components/schemas/MediaCapabilities" }
        limitations:
          type: array
          items: {}
    AppIdentity:
      type: object
      required: [id]
      properties:
        id: { type: string }
        slug: { type: string }
        display_name: { type: string }
    BridgeSourceParticipant:
      type: object
      required: [app, external_user_id, display_name]
      properties:
        app:
          oneOf:
            - { $ref: "#/components/schemas/Network" }
            - { $ref: "#/components/schemas/AppIdentity" }
        external_user_id: { type: string }
        display_name: { type: string }
        profile: { $ref: "#/components/schemas/ExternalProfile" }
        guardians:
          type: array
          items: { $ref: "#/components/schemas/Guardian" }
    BridgeTargetParticipant:
      type: object
      required: [app, identifier, external_user_id, display_name]
      properties:
        app:
          oneOf:
            - { $ref: "#/components/schemas/Network" }
            - { $ref: "#/components/schemas/AppIdentity" }
        identifier: { type: string }
        external_user_id: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        profile: { $ref: "#/components/schemas/ExternalProfile" }
        contact_label: { type: [string, "null"] }
        guardians:
          type: array
          items: { $ref: "#/components/schemas/Guardian" }
    RequestConnection:
      oneOf:
        - $ref: "#/components/schemas/RequestConnectionById"
        - $ref: "#/components/schemas/RequestConnectionBySlug"
    RequestConnectionById:
      type: object
      additionalProperties: false
      required:
        - target_app_id
        - source_external_user_id
        - source_display_name
        - target_identifier
      properties:
        target_app_id: { type: string, format: uuid }
        source_external_user_id: { type: string, maxLength: 160 }
        source_display_name: { type: string, maxLength: 160 }
        target_identifier: { type: string, maxLength: 240 }
        target_contact_label: { type: string, maxLength: 160 }
        external_profile: { $ref: "#/components/schemas/ExternalProfile" }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        guardian_messaging_enabled: { type: boolean }
        source_guardians:
          type: array
          items: { $ref: "#/components/schemas/Guardian" }
        monitoring_disclosure: { type: string }
        external_approval: { type: object, additionalProperties: true }
    RequestConnectionBySlug:
      type: object
      additionalProperties: false
      required:
        - target_app_slug
        - source_external_user_id
        - source_display_name
        - target_identifier
      properties:
        target_app_slug: { type: string }
        source_external_user_id: { type: string, maxLength: 160 }
        source_display_name: { type: string, maxLength: 160 }
        target_identifier: { type: string, maxLength: 240 }
        target_contact_label: { type: string, maxLength: 160 }
        external_profile: { $ref: "#/components/schemas/ExternalProfile" }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        guardian_messaging_enabled: { type: boolean }
        source_guardians:
          type: array
          items: { $ref: "#/components/schemas/Guardian" }
        monitoring_disclosure: { type: string }
        external_approval: { type: object, additionalProperties: true }
    RespondConnection:
      type: object
      required: [bridge_connection_id, status]
      properties:
        bridge_connection_id: { type: string, format: uuid }
        status:
          type: string
          enum: [accepted, rejected, not_found]
        target_external_user_id: { type: string, maxLength: 160 }
        target_display_name: { type: string, maxLength: 160 }
        external_profile: { $ref: "#/components/schemas/ExternalProfile" }
        target_guardians:
          type: array
          items: { $ref: "#/components/schemas/Guardian" }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        response_details: { type: object, additionalProperties: true }
    ConnectionStatus:
      type: string
      enum: [pending_target_approval, accepted, rejected, not_found, blocked, disconnected, expired]
    Connection:
      type: object
      required: [bridge_connection_id, status, source, target, guardian_messaging_enabled, capabilities]
      properties:
        bridge_connection_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ConnectionStatus" }
        source: { $ref: "#/components/schemas/BridgeSourceParticipant" }
        target: { $ref: "#/components/schemas/BridgeTargetParticipant" }
        guardian_messaging_enabled: { type: boolean }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        expires_at: { type: [string, "null"], format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        responded_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
    ConnectionResponse:
      allOf:
        - $ref: "#/components/schemas/Connection"
        - type: object
          required: [ok, request_id]
          properties:
            ok: { const: true }
            request_id: { type: string }
    RobonoConnectionStatus:
      type: string
      enum: [active, pending_invite, blocked, disconnected, expired]
    RobonoUser:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        phone_masked: { type: [string, "null"] }
        avatar_url: { type: [string, "null"], format: uri }
        avatar_version: { type: [string, "null"] }
