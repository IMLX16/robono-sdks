  /robono/network-messages:
    post:
      operationId: sendAdapterNetworkMessage
      tags:
        - Messages
      summary: Send a message across a connected-app relationship
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - bridge_connection_id
                    - external_message_id
                    - message_kind
                    - text_body
                  properties:
                    bridge_connection_id:
                      type: string
                      format: uuid
                    external_message_id:
                      type: string
                      maxLength: 160
