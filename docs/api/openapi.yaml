openapi: 3.1.0
info:
  title: Robono Bridge API
  version: 1.3.0
  description: |
    Provider-neutral API for connecting users across private networks and every
    endpoint advertised by the Robono directory. Send Robono-Api-Version when
    pinning behavior; omitted requests use the current documented version.
  license:
    name: Robono Developer Terms
    url: https://robono.com/terms
servers:
  - url: https://api.robono.com/v1
    description: Production and isolated sandbox traffic; the API key determines the environment
security:
  - apiKey: []
x-robono-api-version-policy:
  current: "2026-07-25"
  minimum-deprecation-notice-days: 90
webhooks:
  robonoEvent:
    post:
      operationId: receiveRobonoWebhook
      summary: Receive a signed connection, message, receipt, transform, failure, or diagnostic event
      security: []
      parameters:
        - name: Robono-Webhook-Id
          in: header
          required: true
          schema: { type: string }
        - name: Robono-Request-Id
          in: header
          required: true
          schema: { type: string }
        - name: Robono-Webhook-Timestamp
          in: header
          required: true
          schema: { type: string, format: date-time }
        - name: Robono-Webhook-Signature
          in: header
          required: true
          schema: { type: string, pattern: "^v1=[a-f0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
            examples:
              connectionStatus:
                summary: Robono-endpoint connection status changed
                value:
                  event: connection.status_changed
                  event_id: evt_01J00000000000000000000010
                  request_id: req_01J00000000000000000000010
                  created_at: "2026-07-25T12:00:10Z"
                  connection_id: 11111111-1111-4111-8111-111111111111
                  status: active
              connectionProfile:
                summary: Robono-endpoint profile changed
                value:
                  event: connection.profile_updated
                  event_id: evt_01J00000000000000000000011
                  request_id: req_01J00000000000000000000011
                  created_at: "2026-07-25T12:00:11Z"
                  connection_id: 11111111-1111-4111-8111-111111111111
                  status: active
              message:
                summary: New message
                value:
                  event: message.created
                  event_id: evt_01J00000000000000000000000
                  request_id: req_01J00000000000000000000000
                  created_at: "2026-07-25T12:00:00Z"
                  connection_id: 11111111-1111-4111-8111-111111111111
                  robono_message_id: 22222222-2222-4222-8222-222222222222
                  external_user_id: child-user-42
                  sender:
                    type: robono_user
                    robono_user_id: 33333333-3333-4333-8333-333333333333
                    display_name: Taylor
                    avatar_url: null
                    avatar_version: null
                    avatar_updated_at: null
                    profile_updated_at: null
                    phone_masked: null
                  message_kind: text
                  text_body: Hello
                  media: null
              messageDelivered:
                summary: Robono-endpoint message delivered
                value:
                  event: message.delivered
                  event_id: evt_01J00000000000000000000012
                  request_id: req_01J00000000000000000000012
                  created_at: "2026-07-25T12:00:12Z"
                  connection_id: 11111111-1111-4111-8111-111111111111
                  robono_message_id: 22222222-2222-4222-8222-222222222222
                  external_message_id: external-message-42
              messageHeard:
                summary: Robono-endpoint message heard
