  /robono/connections:
    post:
      operationId: createAdapterRobonoConnection
      tags:
        - Connections
      summary: Request a relationship with a user at a Robono endpoint
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_phone_e164
                - external_display_name
              properties:
                target_phone_e164:
                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
                external_display_name:
                  type: string
                  maxLength: 160
                external_profile:
                  $ref: ./openapi.yaml#/components/schemas/ExternalProfile
                target_contact_label:
                  type: string
                  maxLength: 160
                monitoring_disclosure:
                  type: string
                external_approval:
                  type: object
                  additionalProperties: true
                capabilities:
                  $ref: ./openapi.yaml#/components/schemas/Capabilities
            examples:
              typical:
                summary: Typical request
                value:
                  target_phone_e164: "+15550100101"
                  external_display_name: Jordan
                  target_contact_label: Riley
                  external_approval:
                    approved: true
                    source: guardian-consent-42
      responses:
        "200":
          description: Robono-endpoint relationship
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/RobonoConnectionResponse
              examples:
                success:
                  summary: Successful response
                  value:
                    connection_id: 11111111-1111-4111-8111-111111111111
                    conversation_id: 44444444-4444-4444-8444-444444444444
                    status: active
                    external_user_id: source-child-42
                    external_display_name: Jordan
                    target_contact_label: Riley
                    capabilities: *a1
                    robono_user: &a4
                      id: 33333333-3333-4333-8333-333333333333
                      display_name: Riley
                      phone_masked: "***-***-0101"
                    phone_masked: "***-***-0101"
                    created_at: 2026-07-25T12:00:00Z
                    updated_at: 2026-07-25T12:00:00Z
                    ok: true
                    request_id: req_01JEXAMPLE0000000000000000
        4XX:
