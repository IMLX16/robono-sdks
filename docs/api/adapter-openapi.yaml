openapi: 3.1.0
info:
  title: Robono App Client API
  version: 1.0.0
  description: |
    Contract between an app's authenticated client and its protected backend.
    Mount these routes at /robono/*. The backend authenticates its
    user, authorizes each operation, replaces any submitted user identifier
    with the authenticated identity, and calls the upstream Robono Bridge API.
    A Robono API key is never sent to a phone or browser.
  license:
    name: Robono Developer Terms
    url: https://robono.com/terms
servers:
  - url: https://your-backend.example
    description: The integrating app's backend
security:
  - childSession: []
paths:
  /robono/networks:
    post:
      operationId: listAdapterNetworks
      tags:
        - Directory
      summary: Return the current endpoint directory
      responses:
        "200":
          description: Current endpoint directory
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/NetworkDirectoryResponse
              examples:
                success:
                  summary: Successful response
                  value:
                    ok: true
                    request_id: req_01JEXAMPLE0000000000000000
                    directory:
                      - type: connected_app
                        id: 77777777-7777-4777-8777-777777777777
                        slug: friend-app
                        display_name: Friend App
                        description: A connected child app.
                        icon_url: https://cdn.example.com/friend-app.png
                        accepts_inbound_bridge_requests: true
                        accepted_identifier:
                          label: Friend code
                          description: Enter the code shown in the friend's app.
                          example: FRIEND-42
                          format: App-issued friend code
                          input_type: text
                          min_length: 6
                          max_length: 32
                          normalization: uppercase
                          case_sensitive: false
                        default_capabilities: &a1
                          allowed_outbound_message_kinds:
                            - text
                            - voice
                          allowed_inbound_message_kinds:
                            - text
                            - voice
                          text:
                            max_characters: 1000
        4XX:
          description: Authentication, authorization, validation, rate-limit, or upstream service error
          headers:
            Retry-After:
              description: Delay before retrying a retryable request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterError"
              examples:
                invalidRequest:
                  summary: Validation or authorization error
                  value:
                    error:
                      code: operation_not_authorized
                      message: The signed-in user is not allowed to perform this operation.
                      retryable: false
                    request_id: req_01JEXAMPLE0000000000000001
        default:
          $ref: "#/components/responses/Error"
  /robono/languages:
    post:
      operationId: listAdapterLanguages
      tags:
        - Directory
      summary: Return languages currently supported by Robono transforms
      responses:
        "200":
          description: Supported languages
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/LanguageResponse
              examples:
                success:
                  summary: Successful response
                  value:
                    ok: true
                    request_id: req_01JEXAMPLE0000000000000000
                    languages:
                      - code: en
                        name: English
                      - code: es
                        name: Spanish
        4XX:
          description: Authentication, authorization, validation, rate-limit, or upstream service error
          headers:
            Retry-After:
              description: Delay before retrying a retryable request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterError"
              examples:
                invalidRequest:
                  summary: Validation or authorization error
                  value:
                    error:
                      code: operation_not_authorized
                      message: The signed-in user is not allowed to perform this operation.
                      retryable: false
                    request_id: req_01JEXAMPLE0000000000000001
        default:
          $ref: "#/components/responses/Error"
  /robono/network-connections:
    post:
      operationId: requestAdapterNetworkConnection
      tags:
        - Connections
      summary: Request a relationship with a user in another connected app
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_display_name
                - target_identifier
              properties:
                target_app_id:
                  type: string
                  format: uuid
                target_app_slug:
                  type: string
                source_display_name:
                  type: string
                  maxLength: 160
                target_identifier:
                  type: string
                  maxLength: 240
                target_contact_label:
                  type: string
                  maxLength: 160
                external_profile:
                  $ref: ./openapi.yaml#/components/schemas/ExternalProfile
                capabilities:
                  $ref: ./openapi.yaml#/components/schemas/Capabilities
                guardian_messaging_enabled:
                  type: boolean
                source_guardians:
                  type: array
                  items:
                    $ref: ./openapi.yaml#/components/schemas/Guardian
                monitoring_disclosure:
                  type: string
                external_approval:
                  type: object
                  additionalProperties: true
            examples:
              typical:
                summary: Typical request
                value:
                  target_app_id: 77777777-7777-4777-8777-777777777777
                  source_display_name: Jordan
                  target_identifier: FRIEND-42
                  monitoring_disclosure: A guardian may review this relationship.
                  external_approval:
                    approved: true
                    source: guardian-consent-42
      responses:
        "200":
          description: Connected-app relationship
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ConnectionResponse
              examples:
                success:
                  summary: Successful response
                  value:
                    bridge_connection_id: 55555555-5555-4555-8555-555555555555
                    status: accepted
                    source: &a2
                      app:
                        id: 66666666-6666-4666-8666-666666666666
                        slug: source-app
                        display_name: Source App
                      external_user_id: source-child-42
                      display_name: Jordan
                    target: &a3
                      app:
                        id: 77777777-7777-4777-8777-777777777777
                        slug: friend-app
                        display_name: Friend App
                      identifier: FRIEND-42
                      external_user_id: target-child-42
                      display_name: Riley
                    guardian_messaging_enabled: false
                    capabilities: *a1
                    accepted_at: 2026-07-25T12:00:00Z
                    created_at: 2026-07-25T12:00:00Z
                    ok: true
                    request_id: req_01JEXAMPLE0000000000000000
        4XX:
          description: Authentication, authorization, validation, rate-limit, or upstream service error
          headers:
            Retry-After:
              description: Delay before retrying a retryable request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterError"
              examples:
                invalidRequest:
                  summary: Validation or authorization error
                  value:
                    error:
                      code: operation_not_authorized
                      message: The signed-in user is not allowed to perform this operation.
                      retryable: false
                    request_id: req_01JEXAMPLE0000000000000001
        default:
          $ref: "#/components/responses/Error"
  /robono/network-connections/respond:
    post:
      operationId: respondAdapterNetworkConnection
      tags:
