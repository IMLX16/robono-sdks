  /robono/network-connections/list:
    post:
      operationId: listAdapterNetworkConnections
      tags:
        - Connections
      summary: Synchronize connected-app relationships for the signed-in user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Page"
                - type: object
                  properties:
                    status:
                      type: string
                    bridge_connection_id:
                      type: string
                      format: uuid
                    connection_id:
                      type: string
                      format: uuid
            examples:
              typical:
                summary: Typical request
                value:
                  status: accepted
                  limit: 50
      responses:
        "200":
          description: Visible connected-app relationships
          content:
            application/json:
              schema:
                type: object
                required:
                  - connections
                  - has_more
                properties:
                  connections:
                    type: array
                    items:
                      $ref: ./openapi.yaml#/components/schemas/Connection
                  has_more:
                    type: boolean
                  next_before:
                    type:
                      - string
                      - "null"
                    format: date-time
              examples:
                success:
                  summary: Successful response
                  value:
                    connections:
                      - bridge_connection_id: 55555555-5555-4555-8555-555555555555
                        status: accepted
                        source: *a2
                        target: *a3
                        guardian_messaging_enabled: false
                        capabilities: *a1
                        accepted_at: 2026-07-25T12:00:00Z
                        created_at: 2026-07-25T12:00:00Z
                    has_more: false
                    next_before: null
        4XX:
          description: Authentication, authorization, validation, rate-limit, or upstream service error
